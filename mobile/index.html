<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Conversation Export Workbench</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Conversation Export Workbench</h1>
      <p>Offline ChatGPT, Claude, and DeepSeek archive viewer</p>
    </div>
    <label class="import-button">
      Import archive
      <input id="bundle-input" type="file" accept=".cew,.zip,.json,application/zip,application/json">
    </label>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search imported chats" autocomplete="off">
        <button id="clear-archive" type="button" class="subtle-button">Clear</button>
      </div>
      <div id="archive-meta" class="archive-meta">No archive imported.</div>
      <ul id="conversation-list" class="conversation-list"></ul>
    </aside>

    <section class="content">
      <div id="empty-state" class="empty-state">
        Import a <code>.cew</code> archive or a ChatGPT, Claude, or DeepSeek export ZIP/JSON.
      </div>
      <article id="conversation" class="conversation" hidden></article>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
