name: Publish versioned release

on:
  push:
    branches:
      - "publish/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'publish/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${{ github.ref_name }}" = "publish/${tag}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    uses: ./.github/workflows/release-candidate.yml
    secrets: inherit

  release:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0

      - name: Ensure tag does not already exist
        shell: bash
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Flatten release assets and generate checksums
        shell: bash
        run: |
          mkdir release-assets
          find artifacts -type f -maxdepth 3 -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file")"
          done
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release-assets/*"

      - name: Create version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Conversation Export Workbench $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          cat > release-notes.md <<NOTES
          Conversation Export Workbench ${TAG} continues the local-first ChatGPT, Claude, and DeepSeek workbench.

          This release includes the provider-neutral canonical rendering path, CEW v2 provenance/merge/attachment support, direct raw provider import on mobile, local app lock/themes/PWA/archive statistics, locked mobile dependencies, and production-signing hooks.

          Installers and mobile artifacts:
          - Windows Setup EXE and portable CLI. Authenticode signatures are applied when Windows signing secrets are configured.
          - macOS PKG and portable CLI. Developer ID signing/notarization are applied when Apple distribution credentials are configured.
          - Linux DEB and portable CLI.
          - Android signed APK/AAB when a stable release keystore is configured; otherwise a directly installable sideload APK.
          - iOS Simulator validation ZIP. A signed IPA is included when Apple device-signing credentials are configured; optional TestFlight upload is controlled by repository configuration.

          Published files are accompanied by SHA-256 checksums and GitHub build-provenance attestations.

          See CHANGELOG.md in the source repository for the detailed ${TAG} changes.
          NOTES

          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

  google-play:
    needs: [gate, build, release]
    if: vars.ENABLE_GOOGLE_PLAY_UPLOAD == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed Android release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate-android
          path: android-release

      - name: Require signed AAB
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(android-release/*.aab)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Google Play upload is enabled but exactly one signed AAB was not produced. Configure the stable Android signing secrets." >&2
            exit 1
          fi

      - name: Upload Android App Bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: software.ngallodev.conversationexportworkbench
          releaseFiles: android-release/*.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          status: completed

  testflight:
    needs: [gate, build, release]
    if: vars.ENABLE_TESTFLIGHT_UPLOAD == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Download signed iOS release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate-ios-device
          path: ios-release

      - name: Configure App Store Connect API key
        shell: bash
        run: |
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"

      - name: Upload IPA to TestFlight
        shell: bash
        run: |
          shopt -s nullglob
          ipas=(ios-release/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "TestFlight upload is enabled but exactly one signed IPA was not produced. Configure Apple signing/provisioning credentials." >&2
            exit 1
          fi
          xcrun altool --upload-app -f "${ipas[0]}" -t ios --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

