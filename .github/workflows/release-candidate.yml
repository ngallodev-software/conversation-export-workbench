name: Release candidate installers

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify synchronized version metadata
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          python_version="$(python -c 'from version import __version__; print(__version__)')"
          mobile_version="$(python -c 'import json; print(json.load(open("mobile/package.json"))["version"])')"
          test "$version" = "$python_version"
          test "$version" = "$mobile_version"
          test -n "$version"

  desktop:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
          - os: macos-latest
            platform: macos
            extension: ""
          - os: windows-latest
            platform: windows
            extension: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build portable binary
        run: pyinstaller conv-tool.spec

      - name: Configure macOS Developer ID signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$MACOS_APPLICATION_IDENTITY" ] && [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
            keychain="$RUNNER_TEMP/cew-signing.keychain-db"
            password="$(openssl rand -hex 24)"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cew-signing.p12"
            security import "$RUNNER_TEMP/cew-signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
            security list-keychains -d user -s "$keychain"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
            codesign --force --timestamp --options runtime --sign "$MACOS_APPLICATION_IDENTITY" dist/conv-tool
            codesign --verify --strict --verbose=2 dist/conv-tool
            echo "MACOS_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "MACOS_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64 -and $env:WINDOWS_SIGNING_PFX_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "cew-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD "dist\conv-tool.exe"
            & $signtool.FullName verify /pa /v "dist\conv-tool.exe"
            "WINDOWS_SIGNING_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "WINDOWS_SIGNING_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify built CLI version
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(./dist/conv-tool${{ matrix.extension }} --version | awk '{print $2}')"
          test "$actual" = "$expected"

      - name: Package Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x installer/linux/build-deb.sh
          version="$(tr -d '[:space:]' < VERSION)"
          installer/linux/build-deb.sh "$version" dist/conv-tool dist amd64
          cp dist/conv-tool "dist/conv-tool-v${version}-linux"

      - name: Package macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
        run: |
          chmod +x installer/macos/build-pkg.sh
          version="$(tr -d '[:space:]' < VERSION)"
          installer/macos/build-pkg.sh "$version" dist/conv-tool dist
          cp dist/conv-tool "dist/conv-tool-v${version}-macos"

      - name: Notarize signed macOS installer
        if: runner.os == 'macOS' && env.MACOS_SIGNING_ENABLED == '1'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_PRIVATE_KEY_BASE64" ]; then
            version="$(tr -d '[:space:]' < VERSION)"
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
            chmod 600 "$key"
            xcrun notarytool submit "dist/ConversationExportWorkbench-${version}-macos.pkg" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "dist/ConversationExportWorkbench-${version}-macos.pkg"
            xcrun stapler validate "dist/ConversationExportWorkbench-${version}-macos.pkg"
          else
            echo "Developer ID package is signed; notarization credentials are not configured."
          fi

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = (Get-Content VERSION).Trim()
          $binary = (Resolve-Path "dist\conv-tool.exe").Path
          $out = (Resolve-Path "dist").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DBinaryPath=$binary" "/DOutputDir=$out" "installer\windows\conversation-export-workbench.iss"
          Copy-Item "dist\conv-tool.exe" "dist\conv-tool-v$version-windows.exe"

      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == '1'
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $setup = "dist\ConversationExportWorkbench-$version-Setup.exe"
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:WINDOWS_SIGNING_PFX /p $env:WINDOWS_SIGNING_PFX_PASSWORD $setup
          & $env:WINDOWS_SIGNTOOL verify /pa /v $setup

      - name: Upload desktop release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-${{ matrix.platform }}
          path: |
            dist/conv-tool-v*-*
            dist/*.deb
            dist/*.pkg
            dist/*Setup.exe
          if-no-files-found: error

  android:
    needs: verify-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.16.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets and Android project
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          npm run native:configure

      - name: Set Android version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          sed -i "s/versionName \"1.0\"/versionName \"${version}\"/" android/app/build.gradle

      - name: Configure Android release signing when credentials are available
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python scripts/configure_android_release.py android/app/build.gradle
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/cew-release.keystore
            echo "CEW_ANDROID_SIGNED=1" >> "$GITHUB_ENV"
            echo "CEW_ANDROID_KEYSTORE=$PWD/android/cew-release.keystore" >> "$GITHUB_ENV"
            echo "CEW_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CEW_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CEW_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CEW_ANDROID_SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK and app bundle
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          if [ "$CEW_ANDROID_SIGNED" = "1" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Prepare Android artifact
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p release
          if [ "$CEW_ANDROID_SIGNED" = "1" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release/ConversationExportWorkbench-v${version}-android.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "release/ConversationExportWorkbench-v${version}-android.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "release/ConversationExportWorkbench-v${version}-android-sideload.apk"
          fi
      - name: Upload Android release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-android
          path: |
            mobile/release/*.apk
            mobile/release/*.aab
          if-no-files-found: error

  ios-simulator:
    needs: verify-version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.16.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets and iOS project
        run: |
          npm run build
          npx cap add ios
          npx cap sync ios
          npm run native:configure

      - name: Build unsigned iOS simulator app
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" ios/App/App/Info.plist || true
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/App.app \
            "release/ConversationExportWorkbench-v${version}-ios-simulator.zip"

      - name: Upload iOS simulator candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-ios-simulator
          path: mobile/release/*.zip
          if-no-files-found: error

  ios-device:
    needs: verify-version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.16.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Detect signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_PRIVATE_KEY_BASE64" ] && [ -n "$IOS_BUNDLE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing credentials are not configured; skipping device/TestFlight build."
          fi

      - name: Build native iOS project
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios
          npm run native:configure

      - name: Configure App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" -archivePath build/App.xcarchive -allowProvisioningUpdates -authenticationKeyPath "$APPLE_API_KEY_PATH" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" archive

      - name: Export signed IPA
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp scripts/ExportOptions.plist build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath release -allowProvisioningUpdates -authenticationKeyPath "$APPLE_API_KEY_PATH" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload IPA to TestFlight
        if: steps.signing.outputs.enabled == 'true' && vars.ENABLE_TESTFLIGHT_UPLOAD == 'true'
        shell: bash
        run: |
          ipa="$(find release -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload signed iOS artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-ios-device
          path: mobile/release/*.ipa
          if-no-files-found: error
