name: Portable binary build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
          - os: macos-latest
            platform: macos
            extension: ""
          - os: windows-latest
            platform: windows
            extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build binary
        run: pyinstaller conv-tool.spec

      - name: Prepare versioned binary
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cp "dist/conv-tool${{ matrix.extension }}" "dist/conv-tool-v${version}-${{ matrix.platform }}${{ matrix.extension }}"

      - name: Verify version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "$(./dist/conv-tool${{ matrix.extension }} --version | awk '{print $2}')" = "$version"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: conv-tool-${{ matrix.platform }}
          path: dist/conv-tool-v*-${{ matrix.platform }}${{ matrix.extension }}
